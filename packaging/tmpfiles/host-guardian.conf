# Managed by the host-guardian package.
# mM: ages by mtime only. The default mask includes atime, so anything that
# reads an incident — grep, an operator, a log shipper — would renew its lease
# and nothing would ever be reaped.
d /var/lib/host-guardian/textfile 0755 root root -
d /var/log/host-guardian/incidents 0750 root root mM:30d
